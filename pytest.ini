[pytest]
# tests/test_app.py starts a real Tk window per test. With pytest's default fd-level capture (fds 1 and 2 moved
# onto temp files) a second or later Tk() in the same process fails about half the time on Windows with Tcl unable
# to source its own init.tcl / tk.tcl; sys-level capture keeps the output quiet without touching the fds.
addopts = --capture=sys
